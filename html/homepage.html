{% extends "base.html" %}

{% block title %}ゆきもり{% endblock %}

{% block head %}
<style>
  .home {
    display: flex;
    flex-direction: column;
    gap: 48px;
  }

  .home-intro {
    padding: 42px 40px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;

    box-shadow:
      0 8px 30px rgba(70, 45, 35, .05);
  }

  .home-intro h1 {
    margin: 0 0 18px;

    font-size: 32px;
    font-weight: 600;
    letter-spacing: .03em;
  }

  .home-intro p {
    margin: 0;

    color: var(--text-secondary);

    font-size: 16px;
    line-height: 1.9;
  }

  .home-intro p + p {
    margin-top: 4px;
  }

  .home-action {
    margin-top: 30px;
  }

  .home-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 10px 20px;

    border: 1px solid var(--accent);
    border-radius: 11px;

    background: var(--accent);
    color: #ffffff;

    font: inherit;
    font-size: 15px;
    text-decoration: none;

    cursor: pointer;

    transition:
      background-color .2s ease,
      border-color .2s ease,
      transform .1s ease;
  }

  .home-button:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .home-button:active {
    transform: translateY(1px);
  }

  .home-section {
    padding: 0 8px;
  }

  .home-section-header {
    margin-bottom: 18px;
  }

  .home-section-header h2 {
    margin: 0;

    font-size: 20px;
    font-weight: 600;
  }

  .home-section-header p {
    margin: 5px 0 0;

    color: var(--text-secondary);

    font-size: 14px;
  }

  .home-test {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    padding: 18px 20px;

    background: rgba(255, 255, 255, .55);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .home-test-name {
    font-size: 15px;
  }

  .home-test-status {
    padding: 5px 11px;

    border: 1px solid var(--border);
    border-radius: 999px;

    color: var(--text-secondary);

    font-size: 13px;
    white-space: nowrap;
  }

  .home-footer {
    padding-top: 8px;

    color: var(--text-secondary);

    font-size: 13px;
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    .home-intro {
      box-shadow:
        0 8px 30px rgba(0, 0, 0, .12);
    }

    .home-test {
      background: rgba(255, 255, 255, .025);
    }
  }

  @media (max-width: 600px) {
    .home {
      gap: 38px;
    }

    .home-intro {
      padding: 32px 26px;
      border-radius: 18px;
    }

    .home-intro h1 {
      font-size: 28px;
    }

    .home-test {
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
{% endblock %}


{% block content %}

<div class="home">

  <section class="home-intro">

    <h1>ゆきもりへようこそ</h1>

    <p>
      這裡是專門用來測試的地方。
    </p>

    <p>
      你可以在這裡休息一下，
      或到留言板寫下你對生活的想法。
    </p>

    <div class="home-action">
      <a class="home-button" href="/board">
        留言板
      </a>
    </div>

  </section>


  <section class="home-section">

    <div class="home-section-header">
      <h2>測試中</h2>
      <p>一些正在準備中的小東西。</p>
    </div>

    <div class="home-test">

      <span class="home-test-name">
        新功能
      </span>

      <span class="home-test-status">
        準備中
      </span>

    </div>

  </section>


  <div class="home-footer">
    ゆきもり · 一個小小的測試場
  </div>

</div>

{% endblock %}
